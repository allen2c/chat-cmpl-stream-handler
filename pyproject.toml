[project]
authors = [{ name = "Allen Chou", email = "f1470891079@gmail.com" }]
dependencies = ["openai (>=1)"]
description = "Chat Completion Stream Handler"
license = { text = "MIT" }
name = "chat-cmpl-stream-handler"
readme = "README.md"
requires-python = ">=3.11,<4"
version = "0.6.0"

[project.urls]
Homepage = "https://github.com/allen2c/chat-cmpl-stream-handler"
"PyPI" = "https://pypi.org/project/chat-cmpl-stream-handler/"
Repository = "https://github.com/allen2c/chat-cmpl-stream-handler"

[tool.poetry]
packages = [{ include = "chat_cmpl_stream_handler" }]

[tool.poetry.extras]
all = []

[tool.poetry.group.dev.dependencies]
black = { extras = ["jupyter"], version = "*" }
isort = "*"
mkdocs-material = "*"
openai-agents = "*"
poetry-plugin-export = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
pytest-env = "*"
pytest-xdist = "*"
rich = "*"
rich-color-support = "*"
ruff = "*"
setuptools = "*"
twine = "*"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
combine_as_imports = true
line_length = 120
profile = "black"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E203"]
select = ["B", "E", "F", "W"]

[tool.pyright]
include = ["chat_cmpl_stream_handler", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
env = ["ENVIRONMENT=test", "PYTEST_IS_RUNNING=true"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]
